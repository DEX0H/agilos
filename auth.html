<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <!-- Google sign-in for the Windows app: signs in here, then hands the Google token to the
         app waiting on this computer (127.0.0.1). Same CSP idea as the game page. -->
    <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' https://apis.google.com; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self' data:; connect-src 'self' https://*.googleapis.com; frame-src https://agilos-c3f7b.firebaseapp.com; object-src 'none'; base-uri 'self'; form-action 'none'" />
    <meta name="referrer" content="no-referrer" />
    <link rel="icon" type="image/png" href="icon-192.png" />
    <title>Agilos sign-in</title>
    <style>
      body { margin: 0; min-height: 100vh; display: grid; place-items: center; background: #0b0d12; color: #fff;
        font: 500 16px 'Rajdhani', system-ui, sans-serif; }
      main { width: min(380px, calc(100% - 32px)); text-align: center; }
      h1 { font: 600 44px/1 'Teko', system-ui, sans-serif; letter-spacing: 0.06em; margin: 0 0 8px; color: #ff8a1f; }
      button { font: 600 17px 'Rajdhani', system-ui, sans-serif; padding: 12px 18px; border-radius: 3px; border: none;
        background: #ff8a1f; color: #10131a; cursor: pointer; width: 100%; }
      p { color: rgba(255,255,255,0.7); }
      #msg.err { color: #ff8a5c; }
    </style>
  </head>
  <body>
    <main>
      <h1>AGILOS</h1>
      <p>Sign in to the Agilos app on this computer.</p>
      <button id="go" type="button">Continue with Google</button>
      <p id="msg"></p>
    </main>
    <script type="module" src="/src/auth-page.js"></script>
  </body>
</html>
