name: Release (Windows)

# Every change merged to main becomes a Windows release automatically (version
# <major>.<minor>.<run number>), published to GitHub Releases, where the website's download
# button and the installed apps' auto-updater find it. A pushed v* tag releases that exact
# package.json version instead.
#
# Signing: when the repository variable SIGNPATH_ORGANIZATION_ID is set (and the secret
# SIGNPATH_API_TOKEN exists), the app and the installer are signed through SignPath.io
# (free for open source; certificate issued by SignPath Foundation) and each signing
# request waits for a maintainer's approval. Without it, the installer is published
# unsigned. See SIGNING.md.

on:
  push:
    branches: [main]
    tags: ['v*']
    paths-ignore: ['**.md', 'docs/**', 'LICENSE', '.github/dependabot.yml']
  workflow_dispatch: # rebuild the latest release by hand (Actions > Release (Windows) > Run workflow)

permissions:
  contents: write   # create the release and upload the installer
  actions: read     # SignPath reads the uploaded build artifact

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  windows:
    runs-on: windows-latest
    env:
      SIGNED: ${{ vars.SIGNPATH_ORGANIZATION_ID != '' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm
      - run: npm ci

      - name: Version
        shell: bash
        run: |
          base="$(node -p "require('./package.json').version")"
          if [ "$GITHUB_REF_TYPE" = "tag" ]; then
            if [ "v$base" != "$GITHUB_REF_NAME" ]; then echo "Tag $GITHUB_REF_NAME does not match v$base"; exit 1; fi
            version="$base"
          else
            # main: same major.minor, patch = this workflow's run number (always increases)
            version="$(echo "$base" | cut -d. -f1-2).${GITHUB_RUN_NUMBER}"
            npm version "$version" --no-git-tag-version --allow-same-version
          fi
          echo "VERSION=$version" >> "$GITHUB_ENV"
          echo "TAG=v$version" >> "$GITHUB_ENV"

      - run: npm run build
        env:
          # Firebase web settings come from repository secrets, never from the code
          VITE_FIREBASE_API_KEY: ${{ secrets.FIREBASE_API_KEY }}
          VITE_FIREBASE_APP_ID: ${{ secrets.FIREBASE_APP_ID }}

      - name: Release notes
        shell: bash
        run: |
          mkdir -p release
          if [ "$SIGNED" = "true" ]; then
            signing="Signed through [SignPath.io](https://signpath.io) (free code signing for open source), certificate by [SignPath Foundation](https://signpath.org)."
          else
            signing="This build is not code-signed yet, so Windows SmartScreen may warn: choose **More info**, then **Run anyway**."
          fi
          {
            echo "**Agilos ${TAG}** for Windows 10 and 11 (64-bit). Download **Agilos-Setup.exe** below, run it, and play."
            echo "The game updates itself when a new version is released (you can turn this off in the menu)."
            echo "Prefer the browser? Play at https://dex0h.github.io/agilos/"
            echo
            echo "$signing"
            echo "[Code signing policy](https://github.com/DEX0H/agilos#code-signing-policy) · [Privacy](https://github.com/DEX0H/agilos#privacy) · Uninstall from Windows Settings > Apps > Agilos."
          } > release/notes.md

      # ---- Unsigned: build and publish in one go ----
      - name: Build installer (unsigned)
        if: env.SIGNED != 'true'
        run: npx electron-builder --win --publish never
      - name: Publish the release (unsigned)
        if: env.SIGNED != 'true'
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # latest.yml is what installed copies read to find and verify the update
          files="release/Agilos-Setup.exe release/Agilos-Setup.exe.blockmap release/latest.yml"
          for f in $files; do test -f "$f" || { echo "missing $f"; ls release; exit 1; }; done
          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" > /dev/null 2>&1; then
            gh release upload "$TAG" $files --repo "$GITHUB_REPOSITORY" --clobber
            gh release edit "$TAG" --repo "$GITHUB_REPOSITORY" --title "Agilos $TAG" --notes-file release/notes.md
          else
            gh release create "$TAG" $files --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" \
              --title "Agilos $TAG" --notes-file release/notes.md --latest
          fi

      # ---- Signed: sign the app, build the installer around it, sign the installer ----
      - name: Package the app
        if: env.SIGNED == 'true'
        run: npx electron-builder --win --dir --publish never
      - name: Upload the unsigned app
        if: env.SIGNED == 'true'
        id: unsigned-app
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: agilos-win-unpacked
          path: release/win-unpacked
      - name: Sign the app (SignPath)
        if: env.SIGNED == 'true'
        uses: signpath/github-action-submit-signing-request@f6d04783b4569d051e0c80105fe66e82819d0092 # v3
        with:
          api-token: ${{ secrets.SIGNPATH_API_TOKEN }}
          organization-id: ${{ vars.SIGNPATH_ORGANIZATION_ID }}
          project-slug: agilos
          signing-policy-slug: release-signing
          artifact-configuration-slug: app
          github-artifact-id: ${{ steps.unsigned-app.outputs.artifact-id }}
          wait-for-completion: true
          wait-for-completion-timeout-in-seconds: 3600
          output-artifact-directory: release/win-signed
      - name: Build the installer from the signed app
        if: env.SIGNED == 'true'
        run: npx electron-builder --win nsis --prepackaged release/win-signed --publish never
      - name: Upload the unsigned installer
        if: env.SIGNED == 'true'
        id: unsigned-installer
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: agilos-setup
          path: release/Agilos-Setup.exe
      - name: Sign the installer (SignPath)
        if: env.SIGNED == 'true'
        uses: signpath/github-action-submit-signing-request@f6d04783b4569d051e0c80105fe66e82819d0092 # v3
        with:
          api-token: ${{ secrets.SIGNPATH_API_TOKEN }}
          organization-id: ${{ vars.SIGNPATH_ORGANIZATION_ID }}
          project-slug: agilos
          signing-policy-slug: release-signing
          artifact-configuration-slug: installer
          github-artifact-id: ${{ steps.unsigned-installer.outputs.artifact-id }}
          wait-for-completion: true
          wait-for-completion-timeout-in-seconds: 3600
          output-artifact-directory: release/signed
      - name: Publish the signed release
        if: env.SIGNED == 'true'
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          node scripts/latest-yml.mjs release/signed/Agilos-Setup.exe "$VERSION" > release/signed/latest.yml
          gh release create "$TAG" release/signed/Agilos-Setup.exe release/signed/latest.yml \
            --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" --title "Agilos $TAG" --notes-file release/notes.md
