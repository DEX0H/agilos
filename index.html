<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Agilos</title>
    <style>
      html, body { margin: 0; height: 100%; overflow: hidden; background: #000; font-family: system-ui, sans-serif; }
      canvas { display: block; }
      #crosshair {
        position: fixed; left: 50%; top: 50%; width: 6px; height: 6px;
        margin: -3px 0 0 -3px; border-radius: 50%;
        background: rgba(255,255,255,0.9); box-shadow: 0 0 2px #000; pointer-events: none;
      }
      #spread {
        position: fixed; left: 50%; top: 50%; width: 0; height: 0;
        transform: translate(-50%, -50%); border-radius: 50%;
        border: 1.5px solid rgba(255,255,255,0.55); pointer-events: none; display: none;
      }
      #hitmarker {
        position: fixed; left: 50%; top: 50%; transform: translate(-50%, -50%);
        color: #fff; font: 700 22px/1 system-ui, sans-serif; opacity: 0;
        text-shadow: 0 0 3px #000; pointer-events: none;
      }
      #damage {
        position: fixed; inset: 0; opacity: 0; pointer-events: none;
        background: radial-gradient(ellipse at center, rgba(0,0,0,0) 50%, rgba(200,0,0,0.85) 100%);
      }
      #dead {
        display: none; position: fixed; inset: 0; align-items: center; justify-content: center;
        color: #ff5555; font: 700 44px system-ui, sans-serif; text-shadow: 0 2px 4px #000;
        pointer-events: none;
      }
      #banner {
        display: none; position: fixed; left: 0; right: 0; top: 22%; justify-content: center;
        text-align: center; white-space: pre-line; color: #fff3e0;
        font: 800 34px/1.35 system-ui, sans-serif; letter-spacing: 1px;
        text-shadow: 0 2px 6px rgba(0,0,0,0.8); pointer-events: none;
      }
      #hud {
        position: fixed; left: 12px; top: 12px; color: #fff; font: 13px/1.4 ui-monospace, monospace;
        text-shadow: 0 1px 2px #000; pointer-events: none; white-space: pre;
      }
      #feed {
        position: fixed; right: 14px; top: 12px; display: flex; flex-direction: column; gap: 4px;
        align-items: flex-end; pointer-events: none; font: 600 13px/1.3 system-ui, sans-serif;
      }
      .feed-line {
        background: rgba(0,0,0,0.45); color: #f1e7d8; padding: 3px 8px; border-radius: 3px;
        transition: opacity 1s;
      }
      .feed-line.mine { background: rgba(160,60,20,0.6); color: #fff; }
      .feed-line.fade { opacity: 0; }
      #overlay {
        position: fixed; inset: 0; display: flex; align-items: center; justify-content: center;
        background: rgba(0,0,0,0.55); color: #fff; text-align: center; pointer-events: none;
      }
      #overlay h1 { margin: 0 0 12px; font-size: 32px; }
      #overlay p { margin: 4px 0; opacity: 0.85; }
      #overlay > div { max-height: 100vh; overflow: auto; padding: 16px; box-sizing: border-box; }
      #overlay .cta { font-weight: 700; opacity: 1; margin: 10px 0; }
      #controlstext { max-width: 760px; margin: 6px auto 12px !important; font-size: 13px; }
      #settings {
        pointer-events: auto; text-align: left; margin: 10px auto 0; max-width: 460px;
        background: rgba(12,14,18,0.82); border: 1px solid rgba(255,255,255,0.12);
        border-radius: 8px; padding: 12px 16px 14px; font-size: 13px;
      }
      #settings h2 { margin: 0 0 8px; font-size: 15px; letter-spacing: 0.5px; }
      #settings .row { display: flex; align-items: center; gap: 10px; margin: 6px 0; }
      #settings .row label { flex: 0 0 140px; opacity: 0.85; }
      #settings select, #settings .sens-num {
        background: #1d2128; color: #fff; border: 1px solid #3a404a; border-radius: 4px; padding: 3px 6px;
      }
      #settings .sens-num { width: 64px; }
      #settings input[type=range] { flex: 1; min-width: 0; }
      #settings .binds {
        display: grid; grid-template-columns: 1fr auto; gap: 4px 12px; align-items: center; margin-top: 10px;
      }
      #settings .binds button, #settings .reset {
        background: #262b33; color: #fff; border: 1px solid #434a55; border-radius: 4px;
        padding: 3px 10px; min-width: 78px; font: 600 12px ui-monospace, monospace; cursor: pointer;
      }
      #settings .binds button:hover, #settings .reset:hover { background: #313741; }
      #settings .binds button.waiting { background: #7a4a14; border-color: #c27a2a; }
      #settings .reset { margin-top: 12px; }
      #shieldtint {
        position: fixed; inset: 0; pointer-events: none; opacity: 0; transition: opacity 0.3s;
        box-shadow: inset 0 0 90px rgba(90,170,255,0.45);
      }
      #hpwrap {
        position: fixed; left: 18px; bottom: 18px; display: flex; align-items: center; gap: 10px;
        pointer-events: none;
      }
      #hpbar {
        position: relative; width: 260px; height: 16px; background: rgba(0,0,0,0.55);
        border: 1px solid rgba(255,255,255,0.25); border-radius: 3px; overflow: hidden;
        transform: skewX(-12deg);
      }
      #hpfill { position: absolute; left: 0; top: 0; bottom: 0; width: 100%; background: #5fd35a; transition: width 0.12s; }
      #hpshield {
        position: absolute; inset: 0; background: linear-gradient(90deg, rgba(90,170,255,0.55), rgba(150,210,255,0.35));
        opacity: 0; transition: opacity 0.3s;
      }
      #hpnum { color: #fff; font: 800 20px/1 system-ui, sans-serif; text-shadow: 0 1px 3px #000; min-width: 44px; }
      #toast {
        position: fixed; left: 50%; top: 62%; transform: translateX(-50%); pointer-events: none;
        color: #fff; font: 700 16px system-ui, sans-serif; text-shadow: 0 1px 3px #000; opacity: 0;
      }
    </style>
  </head>
  <body>
    <div id="crosshair"></div>
    <div id="spread"></div>
    <div id="hitmarker">×</div>
    <div id="damage"></div>
    <div id="dead">YOU DIED</div>
    <div id="banner"></div>
    <div id="shieldtint"></div>
    <div id="hpwrap">
      <div id="hpbar"><div id="hpfill"></div><div id="hpshield"></div></div>
      <div id="hpnum"></div>
    </div>
    <div id="toast"></div>
    <div id="hud"></div>
    <div id="feed"></div>
    <div id="overlay">
      <div>
        <h1>Agilos</h1>
        <p>Battle royale · you and 4 bots · last one standing wins · stay inside the zone</p>
        <p class="cta">Click anywhere outside the panel to play</p>
        <p id="controlstext"></p>
        <div id="settings"></div>
        <p id="lockmsg" style="display:none;color:#ffb3b3;max-width:520px;margin:14px auto 0">
          Your browser blocked mouse lock. This usually happens in an embedded preview.
          Open the game in its own browser tab, then click again.
        </p>
      </div>
    </div>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
